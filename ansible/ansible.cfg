[defaults]
inventory = inventory/generated_fabric.yml
host_key_checking = False
# Lab devices are rebuilt constantly and their host keys change every wipe. Checking
# them here would mean clearing known_hosts after every gen_configs.py --push.
display_skipped_hosts = False
gathering = explicit
# Network devices have no /etc/ansible facts to gather; asking wastes a round trip
# per host. Playbooks that want facts ask for them explicitly.
retry_files_enabled = False
interpreter_python = auto_silent

[persistent_connection]
# One SSH session per device, reused across tasks, through the jump box. IOL takes
# its time answering, and a cold connection through a proxy is slower still.
connect_timeout = 60
command_timeout = 90

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey,password
