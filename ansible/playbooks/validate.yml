---
# Assert the fabric matches the design, from the devices' own point of view.
#
# scripts/verify.py proves reachability from the outside: can a packet get there.
# This proves intent: is every OSPF adjacency actually FULL, is every iBGP session
# actually Established, is the route reflector actually reflecting. A fabric can
# pass ping while quietly running on one spine because the other never came up.
#
#   export LAB_DEVICE_PASS=$(grep '^LAB_DEVICE_PASS=' ~/.cml.env | cut -d= -f2-)
#   ansible-playbook playbooks/validate.yml

- name: Validate the underlay and overlay
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Fail early if the device password was not exported
      ansible.builtin.assert:
        that: ansible_password | length > 0
        fail_msg: >-
          LAB_DEVICE_PASS is empty. Run:
          export LAB_DEVICE_PASS=$(grep '^LAB_DEVICE_PASS=' ~/.cml.env | cut -d= -f2-)
      run_once: true
      delegate_to: localhost

    - name: Collect protocol state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip bgp summary
          - show ip interface brief
      register: state

    - name: Every OSPF adjacency is FULL
      ansible.builtin.assert:
        that: "'EXSTART' not in ospf and 'INIT' not in ospf and 'DOWN' not in ospf"
        success_msg: "OSPF adjacencies clean"
        fail_msg: "OSPF adjacency not FULL on {{ inventory_hostname }}"
      vars:
        ospf: "{{ state.stdout[0] }}"

    - name: A spine sees every leaf, a leaf sees every spine
      ansible.builtin.assert:
        that: neighbor_count == expected
        success_msg: "{{ neighbor_count }} OSPF neighbors, as designed"
        fail_msg: >-
          {{ inventory_hostname }} has {{ neighbor_count }} OSPF neighbors,
          expected {{ expected }} -- a link or an interface is down
      vars:
        # 'FULL/  -' appears once per adjacency on point-to-point links.
        neighbor_count: "{{ state.stdout[0] | regex_findall('FULL') | length }}"
        expected: "{{ leaf_loopbacks | length if inventory_hostname in groups['spines']
                      else spine_loopbacks | length }}"

    - name: No iBGP session is stuck
      ansible.builtin.assert:
        that:
          - "'Idle' not in bgp"
          - "'Active' not in bgp"
          - "'Connect' not in bgp"
        success_msg: "all BGP sessions established"
        fail_msg: >-
          BGP session not established on {{ inventory_hostname }} --
          check reachability to the peer loopback
      vars:
        bgp: "{{ state.stdout[1] }}"

    - name: Leaves advertise their host subnets
      ansible.builtin.assert:
        that: state.stdout[1] is search('65000')
        fail_msg: "{{ inventory_hostname }} is not peering in AS {{ bgp_asn }}"
      when: inventory_hostname in groups['leaves']

    # ---- Phase 2: the overlay -------------------------------------------------
    # These skip themselves entirely when overlay.enabled is false, so this
    # playbook stays correct against a Phase 1 fabric.

    - name: Collect EVPN state
      cisco.ios.ios_command:
        commands:
          - show bgp l2vpn evpn summary
          - show nve vni
      register: evpn
      when: overlay_enabled

    - name: The EVPN address-family is up on every session
      ansible.builtin.assert:
        that:
          - "'Idle' not in afi"
          - "'Active' not in afi"
          - "'Connect' not in afi"
          - afi is search('65000')
        success_msg: "l2vpn evpn address-family established"
        fail_msg: >-
          {{ inventory_hostname }} has no healthy l2vpn evpn session. The usual
          cause is a missing 'send-community both' -- the session comes up and
          every route is then discarded for having no importable route target.
      vars:
        afi: "{{ evpn.stdout[0] }}"
      when: overlay_enabled

    # Deliberately asserts the VNI is Up rather than that an NVE peer exists. A
    # leaf with no local port in a stretched VLAN originates no type-3 route, so
    # its peer never forms -- correct behaviour that a peer-count check would
    # report as a fault.
    - name: Every stretched VNI is up on every leaf
      ansible.builtin.assert:
        that: evpn.stdout[1] is search(item | string + '\s+\S+\s+Up')
        success_msg: "VNI {{ item }} up"
        fail_msg: >-
          VNI {{ item }} is not Up on {{ inventory_hostname }} --
          check 'interface nve1' and the vlan configuration stanza
      loop: "{{ stretched_vnis }}"
      when:
        - overlay_enabled
        - inventory_hostname in groups['leaves']

    - name: A spine reflects EVPN for every leaf, and terminates no tunnel
      ansible.builtin.assert:
        that:
          - evpn.stdout[1] is not search('nve1')
        success_msg: "spine reflects EVPN without being a VTEP"
        fail_msg: >-
          {{ inventory_hostname }} has an NVE interface. A spine should reflect
          EVPN routes and never terminate a VXLAN tunnel.
      when:
        - overlay_enabled
        - inventory_hostname in groups['spines']

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }}):
          {{ state.stdout[0] | regex_findall('FULL') | length }} OSPF neighbors,
          BGP in AS {{ bgp_asn }}, underlay healthy{{
            ', EVPN up' if overlay_enabled else '' }}
